<style>
/* шрифт Gilroy (jsDelivr, закреплённая версия репозитория) */
@font-face{font-family:'Gilroy';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/obycihina95-web/bysergeeva@b1a97ddc3eb154a8c296d45b46d8a7a859c2f2ce/portfolio/fonts/Gilroy-Regular.woff) format('woff')}
@font-face{font-family:'Gilroy';font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/obycihina95-web/bysergeeva@b1a97ddc3eb154a8c296d45b46d8a7a859c2f2ce/portfolio/fonts/Gilroy-Medium.woff) format('woff')}
@font-face{font-family:'Gilroy';font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/obycihina95-web/bysergeeva@b1a97ddc3eb154a8c296d45b46d8a7a859c2f2ce/portfolio/fonts/Gilroy-Semibold.woff) format('woff')}
@font-face{font-family:'Gilroy';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/obycihina95-web/bysergeeva@b1a97ddc3eb154a8c296d45b46d8a7a859c2f2ce/portfolio/fonts/Gilroy-Bold.woff) format('woff')}
/* загрузка, как в исходнике */
#os-boot{position:fixed;z-index:100000;inset:0;background:#24334C;color:#FFF8C7;display:grid;place-items:center;transition:opacity .5s;font-family:'Gilroy',Arial,sans-serif}
#os-boot.os-hide{opacity:0;pointer-events:none}
#os-boot .os-in{text-align:center;display:flex;flex-direction:column;align-items:center}
#os-boot .os-mono{width:92px;height:92px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-bottom:22px;font-weight:700;font-size:30px;letter-spacing:-.08em;position:relative;opacity:0;transform:scale(.72) rotate(-8deg);animation:osLogoIn .8s .18s cubic-bezier(.2,.8,.2,1) forwards}
#os-boot .os-mono::before{content:"";position:absolute;inset:7px;border:1px solid currentColor;border-radius:50%;opacity:.28}
#os-boot .os-mono::after{content:"✦";position:absolute;right:-9px;top:4px;font-size:13px;opacity:0;animation:osSpark 1.5s .85s ease-in-out infinite}
#os-boot b{font-size:15px;letter-spacing:.08em;margin-bottom:5px;opacity:0;animation:osFadeUp .5s .75s ease forwards}
#os-boot small{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:osFadeUp .5s .95s ease forwards}
#os-boot .os-loader{width:260px;max-width:70vw;height:1px;background:rgba(255,248,199,.35);margin:22px auto 12px;overflow:hidden;opacity:0;animation:osFadeUp .35s 1.15s ease forwards}
#os-boot .os-loader::after{content:"";display:block;height:100%;background:currentColor;animation:osLoad 1s 1.25s ease both}
#os-boot .os-ready{animation-delay:2s}
@keyframes osLogoIn{to{opacity:1;transform:none}}
@keyframes osFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes osSpark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
@keyframes osLoad{from{width:0}to{width:100%}}
#os-clock{font:400 11px/14px 'Gilroy',Arial,sans-serif;color:#FFF8C8;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.os-nav .tn-atom:hover{text-decoration:underline;text-underline-offset:4px}
a[href^="#skin-"].os-on{box-shadow:0 0 0 2px #FFF8C7,0 0 0 3.5px #24334C}
/* папки: листы приподнимаются при наведении на свою папку */
.os-folder svg .os-p1,.os-folder svg .os-p2{transition:transform .25s;transform-box:fill-box;transform-origin:center}
.t396__group:hover > .tn-molecule > .os-folder svg .os-p1{transform:translateY(-10%) rotate(-3deg)}
.t396__group:hover > .tn-molecule > .os-folder svg .os-p2{transform:translateY(-16%) rotate(2.5deg)}
/* док: кнопки приподнимаются */
.t396__artboard[data-artboard-recid="4864126601"] .t396__group .t396__group .tn-molecule{transition:transform .15s}
.t396__artboard[data-artboard-recid="4864126601"] .t396__group .t396__group:hover .tn-molecule{transform:translateY(-2px)}
/* вопросы: раскрытие по клику */
.t396 .tn-elem.os-a{display:none!important}
.t396 .tn-elem.os-a.os-show{display:table!important;animation:osFadeUp .35s cubic-bezier(.2,.8,.2,1)}
.os-q,.os-plus{cursor:pointer}
.os-q .tn-atom{transition:padding .2s}
.os-q:hover .tn-atom{padding-left:6px}
.os-plus .tn-atom{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.os-plus.os-open .tn-atom{transform:rotate(45deg)}
/* Тильда ставит группам border-style:solid без ширины, браузер рисует невидимую рамку 3px,
   и ряды карточек, папок и виджетов перестают помещаться. Группы с настоящей рамкой
   задают её своим правилом с id, оно сильнее. */
.t396 .tn-group > .tn-molecule{border-width:0}
/* карточки услуг: описание сменяется тегами */
.tn-molecule:has(> .os-desc){display:grid!important;align-content:start}
.tn-molecule:has(> .os-desc) > .tn-elem{grid-area:1/1;align-self:start}
.os-desc .tn-atom,.os-tags .tn-atom{vertical-align:top}
.tn-molecule:has(> .t396__group > .tn-molecule > .os-desc) > .t396__group:last-child{margin-top:auto!important}
.os-desc{transition:opacity .2s}
.os-tags{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.os-svcplus .tn-atom{transition:transform .2s}
.tn-molecule:has(> .t396__group > .tn-molecule > .os-tags){transition:transform .18s,border-color .18s!important}
@media (hover:hover){
.t396__group:hover > .tn-molecule > .t396__group > .tn-molecule > .os-tags{opacity:1;transform:none}
.t396__group:hover > .tn-molecule > .t396__group > .tn-molecule > .os-desc{opacity:0}
.t396__group:hover > .tn-molecule > .t396__group > .tn-molecule > .os-svcplus .tn-atom{transform:rotate(45deg)}
.t396__group:hover > .tn-molecule:has(> .t396__group > .tn-molecule > .os-tags){transform:translateY(-3px);border-color:#24334C!important}
}
.os-open-card > .tn-molecule > .t396__group > .tn-molecule > .os-tags{opacity:1;transform:none}
.os-open-card > .tn-molecule > .t396__group > .tn-molecule > .os-desc{opacity:0}
.os-open-card > .tn-molecule > .t396__group > .tn-molecule > .os-svcplus .tn-atom{transform:rotate(45deg)}
.os-open-card > .tn-molecule{border-color:#24334C!important}
/* кейсы: скриншоты приподнимаются при наведении */
.tn-molecule:has(> .os-shot){transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.t396__group:hover > .tn-molecule:has(> .os-shot){transform:translateY(-4px) rotate(-.5deg);box-shadow:0 18px 40px rgba(0,0,0,.12)}
/* кейсы: вкладки страниц и «браузер» */
.os-tab{cursor:pointer}
.os-tab .tn-atom{transition:background-color .2s,color .2s}
.os-tab.os-on .tn-atom{background-color:#24334D!important;color:#FFF8C6!important;border-color:#24334D!important}
.os-view img{transition:opacity .25s}
/* кейсы: телефоны листаются сами, при наведении останавливаются */
.os-scroll{animation:osPhone 30s ease-in-out infinite alternate}
.os-d6{animation-delay:-6s}.os-d12{animation-delay:-12s}
.t396__group:hover > .tn-molecule > .os-scroll{animation-play-state:paused}
@keyframes osPhone{0%,6%{transform:translateY(0)}94%,100%{transform:translateY(calc(-100% + 420px))}}
@media (max-width:639px){@keyframes osPhone{0%,6%{transform:translateY(0)}94%,100%{transform:translateY(calc(-100% + 380px))}}}
/* кейсы: образцы цветов и пункты карты сайта */
.os-sw .tn-atom{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.os-sw:hover .tn-atom{transform:scale(1.07) rotate(-3deg)}
.os-li .tn-atom{transition:transform .2s}
.os-li:hover .tn-atom{transform:translateX(3px)}
/* кейсы: «было / стало» */
.os-ba-knob,.os-ba-line{pointer-events:none}
.os-hint .os-ba-knob,.os-hint .os-ba-line{transition:left .9s cubic-bezier(.5,0,.2,1)}
.os-hint .t396__group{transition:width .9s cubic-bezier(.5,0,.2,1)}
/* кнопка подарка подмигивает */
.os-nudge .tn-atom{animation:osNudge 2.4s 1.5s ease-in-out infinite}
@keyframes osNudge{0%,100%{transform:none}8%{transform:translateY(-3px)}16%{transform:none}}
/* бейдж «50+» покачивается */
.os-sway .tn-atom{animation:osSway 5s 1.6s ease-in-out infinite}
@keyframes osSway{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
/* точка «на связи» */
.os-ping{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fae5a;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(63,174,90,.2)}
.os-ping.os-live{animation:osPing 1.8s ease-out infinite}
@keyframes osPing{0%{box-shadow:0 0 0 0 rgba(63,174,90,.5)}80%,100%{box-shadow:0 0 0 8px rgba(63,174,90,0)}}
@media (prefers-reduced-motion:reduce){#os-boot *,.os-nudge .tn-atom,.os-sway .tn-atom,.os-ping,.os-scroll{animation:none!important;opacity:1!important;transform:none!important}}
/* Телефон: окна на всю ширину экрана. Сетка Тильды 360/480/640 оставляла по бокам до 40px пустоты. */
@media (max-width:639px){
.t1093 .t396__artboard{padding-left:8px!important;padding-right:8px!important}
.t1093 .t396__artboard>.t396__group{width:100%!important}
.t1093 .t396__group:has(>.tn-molecule>.os-ba-knob){width:100%!important;height:auto!important;aspect-ratio:4/5}
.t1093 .t396__group:has(>.tn-molecule>.os-ba-knob)>.tn-molecule>.tn-elem[data-elem-type="image"]{width:100%!important;height:100%!important}
.t1093 .t396__group:has(>.tn-molecule>.os-ba-knob)>.tn-molecule>.tn-elem[data-elem-type="image"]+.tn-elem{left:auto!important;right:12px}
.t1093 .t396__group:has(>.tn-molecule>.os-ba-knob)>.tn-molecule>.t396__group{height:100%!important}
/* без !important, чтобы ползунок «было / стало» мог двигать их своими стилями */
.t1093 .t396__group:has(>.tn-molecule>.os-ba-knob)>.tn-molecule>.t396__group:not(#os1):not(#os2){width:50%}
.t1093 .os-ba-line:not(#os1):not(#os2){left:calc(50% - 1px);height:100%}
.t1093 .os-ba-knob:not(#os1):not(#os2){left:calc(50% - 20px);top:calc(50% - 20px)}
}
</style>
<div id="os-clock"></div>
<div id="os-boot" aria-hidden="true"><div class="os-in"><div class="os-mono">OS</div><b>OKSANA SERGEEVA</b><small>Сайты для вашего дела</small><div class="os-loader"></div><small class="os-ready">Рабочий стол готов</small></div></div>
<script>
(function(){
  var boot=document.getElementById('os-boot');
  var quick=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(boot){document.body.appendChild(boot);setTimeout(function(){boot.classList.add('os-hide')},quick?50:2300);setTimeout(function(){boot.remove()},quick?600:2900);}
  var c=document.getElementById('os-clock');
  function tick(){if(!c)return;var d=new Date();c.textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
  tick();setInterval(tick,15000);
  /* Темы. Порядок цветов: фон, текст на фоне, панель, текст, вторичный текст, линии, папка2, папка3,
     тёмная кнопка, текст на ней, вторичный на тёмном, наведение, фон карточек, затемнение под окном,
     фон скриншотов, карточки кита */
  var K=['92acdd','fff8c8','fff8c7','24334c','52647c','6f8fbe','f4ebaa','e9dd8e','24334d','fff8c6','c9d6ee','3a4d6e','f2efca','7186ac','f2ecc0','fff9cf'];
  var S={blue:K,
    rose:['422b26','fff4ef','f7d8e0','422b26','765d58','c9aeb1','eabec9','dfaab7','422b26','fff4ef','dfaab7','765d58','e1c3ca','3e2824','eccec5','f8dee5'],
    matcha:['a5af5d','283019','f7f7e7','3e4628','68713f','89934d','e5e7c4','d3d79f','3e4628','f7f7e7','d3d79f','68713f','edeed6','6b733d','ececdb','f8f8ea'],
    graphite:['232426','f4f2ed','e9e7e2','232426','6b6b68','8b8b87','d3d1cc','bcbbb7','232426','f4f2ed','bcbbb7','6b6b68','d1d0cc','1d1e20','dddbd7','eceae6']};
  var pat='#('+K.join('|')+')(?![0-9a-f])';
  function sw(t,m){return t.replace(new RegExp(pat,'gi'),function(a,h){return '#'+m[K.indexOf(h.toLowerCase())];});}
  var cur='blue';
  function apply(s){
    if(!S[s])s='blue';cur=s;var m=S[s],test=new RegExp(pat,'i');
    document.querySelectorAll('style').forEach(function(st){
      if(st._osOrig===undefined)st._osOrig=test.test(st.textContent)?st.textContent:null;
      if(st._osOrig!==null)st.textContent=sw(st._osOrig,m);
    });
    document.querySelectorAll('.tn-atom [style], .tn-atom svg [fill], .tn-atom svg [stroke], .t1093 [style]').forEach(function(el){
      ['style','fill','stroke'].forEach(function(a){var v=el.getAttribute(a);if(!v)return;var k='os'+a;if(el.dataset[k]===undefined){if(!test.test(v))return;el.dataset[k]=v;}el.setAttribute(a,sw(el.dataset[k],m));});
    });
    document.querySelectorAll('a[href^="#skin-"]').forEach(function(a){a.classList.toggle('os-on',a.getAttribute('href')==='#skin-'+s);});
    try{localStorage.setItem('os-skin',s)}catch(e){}
  }
  function card(el){var g=el.closest('.t396__group');while(g){if(g.querySelector(':scope > .tn-molecule > .t396__group > .tn-molecule > .os-tags'))return g;g=g.parentElement&&g.parentElement.closest('.t396__group');}return null;}
  function scroller(el){while(el&&el!==document.body){if(el.scrollHeight>el.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowY))return el;el=el.parentElement;}return null;}
  /* «было / стало»: тянуть мышкой или пальцем */
  function initBA(){
    document.querySelectorAll('.os-ba-knob').forEach(function(k){
      if(k._os)return;k._os=1;
      var box=k.closest('.t396__group');if(!box)return;
      var line=box.querySelector('.os-ba-line');var mark=box.querySelector('.os-ba-mark');var bef=mark&&mark.closest('.t396__group');
      function set(p){p=Math.max(0,Math.min(100,p));if(bef)bef.style.width=p+'%';if(line)line.style.left='calc('+p+'% - 1px)';k.style.left='calc('+p+'% - 20px)';}
      box._osSet=set;var drag=false;
      function mv(e){var r=box.getBoundingClientRect();set((e.clientX-r.left)/r.width*100);}
      box.style.cursor='ew-resize';box.style.touchAction='pan-y';
      box.addEventListener('pointerdown',function(e){drag=true;box.classList.remove('os-hint');mv(e);});
      window.addEventListener('pointermove',function(e){if(drag)mv(e);});
      window.addEventListener('pointerup',function(){drag=false;});
    });
  }
  function hint(){
    document.querySelectorAll('.os-ba-knob').forEach(function(k){
      var box=k.closest('.t396__group');if(!box||!box._osSet||box.offsetParent===null)return;
      box.classList.add('os-hint');box._osSet(50);
      setTimeout(function(){box._osSet(72)},700);setTimeout(function(){box._osSet(35)},1600);
      setTimeout(function(){box._osSet(50)},2500);setTimeout(function(){box.classList.remove('os-hint')},3500);
    });
  }
  document.addEventListener('click',function(e){
    var t=e.target;if(!t.closest)return;
    var a=t.closest('a[href^="#skin-"]');
    if(a){e.preventDefault();e.stopPropagation();apply(a.getAttribute('href').slice(6));return;}
    var q=t.closest('.os-q, .os-plus');
    if(q){var row=q.closest('.t396__group');var item=row&&row.parentElement.closest('.t396__group');if(item){var ans=item.querySelector('.os-a');var pl=row.querySelector('.os-plus');if(ans)ans.classList.toggle('os-show');if(pl)pl.classList.toggle('os-open');}return;}
    var tab=t.closest('.os-tab');
    if(tab){
      var ab=tab.closest('.t396__artboard');var im=ab&&ab.querySelector('.os-view img');var u=ab&&ab.querySelector('.os-url .tn-atom');
      ab.querySelectorAll('.os-tab').forEach(function(x){x.classList.toggle('os-on',x===tab);});
      if(u&&tab.dataset.url)u.textContent=tab.dataset.url;
      if(im&&tab.dataset.src){im.style.opacity=0;setTimeout(function(){im.onload=function(){im.style.opacity=1;};im.setAttribute('data-original',tab.dataset.src);im.src=tab.dataset.src;var sc=scroller(im.parentElement);if(sc)sc.scrollTop=0;},180);}
      return;
    }
    var link=t.closest('a[href^="#case-"]');
    if(link){setTimeout(function(){initBA();hint();},500);}
    if(window.matchMedia('(hover: none)').matches){var cd=card(t);if(cd)cd.classList.toggle('os-open-card');}
  },true);
  var saved='blue';try{saved=localStorage.getItem('os-skin')||'blue'}catch(e){}
  function start(){apply(saved);initBA();document.querySelectorAll('.os-ping').forEach(function(p){p.classList.add('os-live')});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  window.addEventListener('load',function(){apply(cur);initBA();});
})();
</script>
